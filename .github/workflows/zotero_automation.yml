name: Weekly Research Sync

on:
  schedule:
    # USER: Update this cron schedule to your preferred time.
    # Current: Runs at 08:00 UTC every Monday.
    - cron: '0 8 * * 1' 
  workflow_dispatch: # Allows manual trigger for testing

# Grant permission to write files back to the repo
permissions:
  contents: write

jobs:
  sync_scholar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyarrow 
        pip install pyvis

    # Step 1: Run the Collector & Analyst
    - name: Run Scholar Sync
      env:
        ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python scholar_sync.py

    # Step 2: Run the Synthesizer
    - name: Run Synthesizer
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python synthesize.py

    # Step 3: Run the Gap Hunter
    - name: Run Gap Hunter
      run: python gap_hunter.py

    # Step 4: Metadata Cleanup (Fix Manual Imports)
    - name: Run Metadata Cleanup
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python fix_metadata.py
       
    # Step 5: Run Visualizer
    - name: Build Knowledge Graph
      run: python visualize_library.py

    # Step 6: Upload to Dropbox
    - name: Upload to Dropbox
      env:
        DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      run: python dropbox_sync.py

    # Step 7: Save to GitHub
    # We Add and Commit FIRST to clear the "unstaged changes" error.
    # THEN we pull and push.
    - name: Commit Dashboard
      run: |
        git config --global user.name 'Research Bot'
        git config --global user.email 'actions@github.com'
        
        # 1. STAGE EVERYTHING
        git add .
        
        # 2. COMMIT
        # This makes the directory "clean" so rebase works
        git commit -m "Weekly Synthesis Update" || echo "No changes to commit"
        
        # 3. PULL (Check for updates from the cloud)
        git pull --rebase origin main
        
        # 4. PUSH WITH RETRY
        n=0
        until [ "$n" -ge 3 ]
        do
           git push && break
           n=$((n+1))
           echo "Push failed. Retrying in 15 seconds... (Attempt $n/3)"
           sleep 15
        done
