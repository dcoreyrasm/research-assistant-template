name: Weekly Zotero Sync

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_scholar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Sync Script
      env:
        ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
      run: python scholar_sync.py

    - name: Commit Log Update
      run: |
        git config --global user.name 'Zotero Bot'
        git config --global user.email 'actions@github.com'
        git add LAST_RUN_LOG.md
        git commit -m "Update Weekly Log" || echo "No changes to commit"
        git push
