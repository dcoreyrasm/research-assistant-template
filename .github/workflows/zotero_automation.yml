name: Weekly Zotero Sync

on:
  schedule:
    - cron: '0 8 * * 1' # Runs at 08:00 UTC (3:00 AM EST) every Monday
  workflow_dispatch: # Allows manual trigger for testing

# Grant permission to write files back to the repo
permissions:
  contents: write

jobs:
  sync_scholar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # Using 3.11 to support latest Google AI features

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # We don't need explicit pyarrow install here as it is now in requirements.txt

    # Step 1: Run the Collector & Analyst
    # Finds papers, adds 10-pt summaries to Zotero, saves individual MD files, builds Matrix
    - name: Run Scholar Sync
      env:
        ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python scholar_sync.py

    # Step 2: Run the Synthesizer (The Dissertation Drafter)
    # Reads the Matrix and writes the comparative narrative
    - name: Run Synthesizer
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python synthesize.py

    # Step 3: Upload Reports to Dropbox
    # Saves the Synthesis, Executive Brief, and Deep Dives to your Dropbox folder
    - name: Upload Reports to Dropbox
      env:
        DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      run: python dropbox_sync.py

    # Step 4: Save all the new files to GitHub
    # We use 'git add .' to safely add everything that changed without erroring on missing files
    - name: Commit Dashboard and Matrix
      run: |
        git config --global user.name 'Zotero Bot'
        git config --global user.email 'actions@github.com'
        git add .
        git commit -m "Weekly Synthesis Update" || echo "No changes to commit"
        # FIX: Pull latest changes from the web (rebase) before pushing to avoid conflicts
        git pull --rebase origin main
        git push
